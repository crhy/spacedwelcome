<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">SpacedBazaar icon</title>
  <desc id="desc">A monochrome Spaced Linux themed market stall icon for Bazaar, with a circular negative-space S shop badge.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555555"/>
      <stop offset="0.48" stop-color="#343434"/>
      <stop offset="1" stop-color="#202020"/>
    </linearGradient>
    <linearGradient id="awningDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4b4b"/>
      <stop offset="1" stop-color="#242424"/>
    </linearGradient>
    <linearGradient id="awningLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f3f3"/>
      <stop offset="1" stop-color="#bdbdbd"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f3f3"/>
      <stop offset="1" stop-color="#c0c0c0"/>
    </linearGradient>
  </defs>

  <!-- Feet -->
  <rect x="20" y="96" width="12" height="24" rx="6" fill="#292929"/>
  <rect x="96" y="96" width="12" height="24" rx="6" fill="#292929"/>
  <rect x="22" y="100" width="8" height="18" rx="4" fill="#4a4a4a" opacity="0.55"/>
  <rect x="98" y="100" width="8" height="18" rx="4" fill="#4a4a4a" opacity="0.55"/>

  <!-- Stall body -->
  <path d="M24 32h80c6.627 0 12 5.373 12 12v60c0 6.627-5.373 12-12 12H24c-6.627 0-12-5.373-12-12V44c0-6.627 5.373-12 12-12Z" fill="url(#frame)"/>
  <rect x="20" y="58" width="88" height="43" rx="5" fill="#272727"/>
  <rect x="20" y="72" width="88" height="8" fill="#555555"/>
  <rect x="20" y="96" width="88" height="8" fill="#777777"/>
  <rect x="24" y="80" width="80" height="16" rx="4" fill="#383838"/>

  <!-- Small merchandise cues, kept monochrome -->
  <circle cx="37" cy="88" r="5" fill="#727272"/>
  <rect x="89" y="83" width="10" height="10" rx="2.5" fill="#727272"/>

  <!-- Spaced Linux shop badge -->
  <circle cx="64" cy="87" r="18" fill="#181818" stroke="#707070" stroke-width="2"/>
  <circle cx="64" cy="87" r="14" fill="url(#badge)"/>
  <!-- Negative-space S: an intentionally absent S cut into the circular mark -->
  <path d="M75 78.5c-2.7-4.7-8.4-6.5-13.7-5.1-5.7 1.5-9.1 5.2-8.2 8.8.9 3.8 5.6 4.7 10.8 5.5 5.1.8 9.1 1.4 10 4.8.9 3.6-2.4 7.1-8 8.2-5.4 1.1-11-.8-13.7-5.3" fill="none" stroke="#272727" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="64" cy="87" r="14" fill="none" stroke="#eeeeee" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Canopy backing -->
  <path d="M10 12h108a6 6 0 0 1 6 6v36H4V18a6 6 0 0 1 6-6Z" fill="#2f2f2f"/>

  <!-- Alternating Spaced monochrome awning panels -->
  <path d="M10 12h18v42H4V18a6 6 0 0 1 6-6Z" fill="url(#awningDark)"/>
  <rect x="28" y="12" width="24" height="42" fill="url(#awningLight)"/>
  <rect x="52" y="12" width="24" height="42" fill="url(#awningDark)"/>
  <rect x="76" y="12" width="24" height="42" fill="url(#awningLight)"/>
  <path d="M100 12h18a6 6 0 0 1 6 6v36h-24Z" fill="url(#awningDark)"/>

  <!-- Scalloped canopy edge, preserving Bazaar's stall silhouette -->
  <circle cx="16" cy="54" r="12" fill="#2b2b2b"/>
  <circle cx="40" cy="54" r="12" fill="#dedede"/>
  <circle cx="64" cy="54" r="12" fill="#2b2b2b"/>
  <circle cx="88" cy="54" r="12" fill="#dedede"/>
  <circle cx="112" cy="54" r="12" fill="#2b2b2b"/>

  <!-- Metallic top highlight and edge -->
  <path d="M10 12h108a6 6 0 0 1 6 6v2H4v-2a6 6 0 0 1 6-6Z" fill="#ffffff" opacity="0.16"/>
  <path d="M4 54h120" stroke="#111111" stroke-opacity="0.45" stroke-width="1"/>
</svg>
