name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set deterministic package timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils dpkg-dev flatpak ostree shellcheck
      - name: Run behavioral and source checks
        run: make check
      - name: Build Debian package
        run: make deb
      - name: Inspect package contract
        run: |
          test -f "dist/spaced-welcome_$(cat VERSION)_all.deb"
          dpkg-deb --info "dist/spaced-welcome_$(cat VERSION)_all.deb"
          dpkg-deb --contents "dist/spaced-welcome_$(cat VERSION)_all.deb"
      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spaced-welcome-deb
          path: dist/spaced-welcome_*_all.deb

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1b74b57fa75e61b217e90072aec7ba7d618613fea982106cb3e813c002662162
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build Flatpak repository
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          manifest-path: flatpak/io.github.crhy.SpacedWelcome.yml
          branch: master
          repo-dir: spaced-welcome-repo
          build-bundle: false
          upload-artifact: false
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Verify exported metadata and icon
        shell: bash
        run: |
          set -euo pipefail
          probe=$(mktemp -d)
          checkout="$probe/checkout"
          ref=app/io.github.crhy.SpacedWelcome/x86_64/master
          ostree --repo=spaced-welcome-repo refs | grep -Fx "$ref"
          ostree --repo=spaced-welcome-repo checkout --user-mode "$ref" "$checkout"
          test -f "$checkout/export/share/metainfo/io.github.crhy.SpacedWelcome.metainfo.xml"
          test -s "$checkout/export/share/icons/hicolor/512x512/apps/io.github.crhy.SpacedWelcome.png"
