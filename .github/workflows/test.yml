name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils dpkg-dev flatpak ostree shellcheck
      - name: Run behavioral and source checks
        run: make check
      - name: Build Debian package
        run: make deb
      - name: Inspect package contract
        run: |
          test -f "dist/spaced-welcome_$(cat VERSION)_all.deb"
          dpkg-deb --info "dist/spaced-welcome_$(cat VERSION)_all.deb"
          dpkg-deb --contents "dist/spaced-welcome_$(cat VERSION)_all.deb"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: spaced-welcome-deb
          path: dist/spaced-welcome_*_all.deb

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Flatpak repository
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.crhy.SpacedWelcome.yml
          branch: master
          repo-dir: spaced-welcome-repo
          build-bundle: false
          upload-artifact: false
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Verify exported metadata and icon
        shell: bash
        run: |
          set -euo pipefail
          probe=$(mktemp -d)
          checkout="$probe/checkout"
          ref=app/io.github.crhy.SpacedWelcome/x86_64/master
          ostree --repo=spaced-welcome-repo refs | grep -Fx "$ref"
          ostree --repo=spaced-welcome-repo checkout --user-mode "$ref" "$checkout"
          test -f "$checkout/export/share/metainfo/io.github.crhy.SpacedWelcome.metainfo.xml"
          test -f "$checkout/export/share/icons/hicolor/scalable/apps/io.github.crhy.SpacedWelcome.svg"
