name: Release Debian package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify release version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils dpkg-dev flatpak ostree shellcheck
      - name: Test and build
        run: |
          make check
          make deb
          cd dist
          sha256sum "spaced-welcome_$(cat ../VERSION)_all.deb" > "spaced-welcome_$(cat ../VERSION)_all.deb.sha256"
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Spaced Linux Welcome ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/spaced-welcome_*_all.deb
            dist/spaced-welcome_*_all.deb.sha256
